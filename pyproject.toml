[project]
name = "health-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diwash Adhikari", email = "diwash.adhi4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.8",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
health-agents = "health_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
